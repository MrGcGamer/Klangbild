name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests und Release-APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Robolectric android-all
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit- und Screenshot-Tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true --stacktrace

      - name: Signierte Release-APK (R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Version auslesen
        id: version
        run: |
          meta=app/build/outputs/apk/release/output-metadata.json
          echo "version_code=$(jq -r '.elements[0].versionCode' $meta)" >> "$GITHUB_OUTPUT"
          echo "version_name=$(jq -r '.elements[0].versionName' $meta)" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk klangbild.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: klangbild-apk
          path: klangbild.apk
          if-no-files-found: error

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: warn

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests

  smoke:
    name: Smoke-Test auf Android-TV-Emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: klangbild-apk

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Demo-Modus auf Android TV 14 starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/tv-smoke.sh klangbild.apk

      - name: Smoke-Test-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: warn

  release:
    name: GitHub-Release (main)
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: klangbild-apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ needs.build.outputs.version_code }}
          name: Klangbild ${{ needs.build.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Signierte Release-APK für Google TV (Sideload).

            Installation: `adb install -r klangbild.apk`

            Fester Link auf die jeweils neueste Version:
            `https://github.com/${{ github.repository }}/releases/latest/download/klangbild.apk`
          files: klangbild.apk
